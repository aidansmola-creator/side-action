<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4a37">
<title>Side Action — Golf Side Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#1d4a37; --board-deep:#153829; --board-soft:#2b5c47;
  --sage:#e6ece4; --sheet:#fbfbf8; --ink:#16231c; --soft:#5f7067; --rule:#d5ddd3;
  --red:#c4152c; --flag:#f3c623; --venmo:#008cff; --win:#2f7d3c;
  --r-lg:20px; --r-md:12px;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sage);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

/* app bar */
.top{position:sticky;top:0;z-index:5;background:var(--board);color:#fff;padding:calc(12px + var(--safe-t)) 18px 12px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;flex:none}
.title{flex:1;min-width:0}
.title b{display:block;font:700 22px/1 var(--cond);letter-spacing:.01em}
.title span{display:block;font-size:13px;color:#b9d0c3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.1);border:0;border-radius:10px;color:#fff;font-weight:600;font-size:14px;padding:8px 12px}
.back{background:none;border:0;color:#fff;font-weight:600;font-size:15px;padding:6px 4px;display:flex;align-items:center;gap:4px}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(150px + var(--safe-b))}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--rule);padding:6px 8px calc(6px + var(--safe-b))}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--soft);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--board)}
.tab.on svg{stroke-width:2.4}
.tab:disabled{opacity:.35;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:calc(62px + var(--safe-b));z-index:5;padding:14px 16px 10px;background:linear-gradient(rgba(230,236,228,0),var(--sage) 40%)}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:var(--r-md);padding:14px 18px;font-weight:700;font-size:16px}
.btn-main{flex:1;background:var(--board);color:#fff}
.btn-quiet{background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
.btn-danger{background:none;color:var(--red);border:1px solid #efc3c9}
.btn:disabled{opacity:.4;cursor:default}

/* sheets & forms */
.sheet{background:var(--sheet);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;border:1px solid var(--rule)}
.sheet h3{font:700 20px/1.1 var(--cond);margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--soft);font-size:14px;margin:0 0 14px}
.field{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:0 0 6px}
.input{width:100%;min-width:0;background:#fff;border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 13px;font-size:16px}
.input:focus{outline:none;border-color:var(--board);box-shadow:0 0 0 3px rgba(29,74,55,.15)}
.choice{display:grid;grid-template-columns:1fr 1fr;background:var(--sage);border-radius:var(--r-md);padding:4px;gap:4px}
.choice button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--soft)}
.choice button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(22,35,28,.12)}
.game{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 0;border-top:1px solid var(--rule)}
.game:first-of-type{border-top:0;padding-top:4px}
.game-name{font-weight:700}
.game-desc{color:var(--soft);font-size:14px;grid-column:1}
.stake{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--soft)}
.money-in{display:flex;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:var(--r-md);padding:0 10px;width:96px}
.money-in input{border:0;background:none;width:100%;padding:9px 4px;font-size:16px;font-weight:700;color:var(--ink)}
.money-in input:focus{outline:none}
.toggle{position:relative;width:50px;height:30px;grid-row:1/3;grid-column:2;align-self:center;flex:none}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:30px;background:#c9d3c7;transition:background .2s}
.toggle i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked+i{background:var(--board)}
.toggle input:checked+i:after{transform:translateX(20px)}
.toggle input:focus-visible+i{outline:3px solid var(--flag);outline-offset:2px}
.inline-toggle{display:flex;align-items:center;gap:8px;margin-left:auto}
.inline-toggle .toggle{grid-row:auto;grid-column:auto}
.gate{display:flex;gap:12px;align-items:flex-start;background:#fdf6d8;border-radius:var(--r-md);padding:12px;font-size:14px;color:#5c4a00;margin-top:12px;cursor:pointer}
.gate input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--board);flex:none}

/* avatars */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px/1 Barlow;flex:none;overflow:hidden;background-size:cover;background-position:center}
.av.sm{width:28px;height:28px;font-size:12px}
.av.lg{width:88px;height:88px;font-size:34px;border:3px solid rgba(255,255,255,.9)}

/* round crew picker */
.crew-in{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.crew-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--rule);border-radius:var(--r-md);padding:8px 8px 8px 10px}
.crew-row b{flex:1;font-weight:700}
.crew-row .rm{border:0;background:none;color:var(--soft);font-size:22px;width:38px;height:38px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pchip{display:flex;align-items:center;gap:8px;border:1px dashed #b7c4b6;background:none;border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;font-size:15px}
.newp{display:flex;gap:8px}
.newp .btn{padding:0 16px;font-size:15px;flex:none}

/* hole */
.hole-hero{background:var(--board);color:#fff;border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:14px}
.hole-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hole-no{font:800 84px/.8 var(--cond);letter-spacing:-.02em}
.hole-no small{font-size:20px;font-weight:600;color:#9fbfae;letter-spacing:0;margin-left:6px}
.par-ctl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:var(--r-md);padding:5px}
.par-ctl button{width:34px;height:34px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:700}
.par-ctl span{font:700 20px var(--cond);min-width:52px;text-align:center}
.gps{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.gps-yds{font:800 34px/1 var(--cond)}
.gps-yds small{font-size:15px;font-weight:600;color:#9fbfae;margin-left:3px}
.gps-msg{flex:1;font-size:14px;color:#cfe0d6;line-height:1.35}
.finder{display:flex;flex-direction:column;gap:8px}
.near{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.near svg{width:18px;height:18px}
.newp .btn{padding:0 16px;font-size:15px;flex:none}
.find-msg{font-size:14px;color:var(--soft);margin:10px 0 0}
.find-msg.err{color:var(--red)}
.finds{display:flex;flex-direction:column;margin-top:10px;border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden}
.find{border:0;border-top:1px solid var(--rule);background:#fff;text-align:left;padding:11px 13px}
.find:first-child{border-top:0}
.find b{display:block;font-weight:700}
.find span{font-size:13px;color:var(--soft)}
.map-note{font-size:13px;color:var(--soft);margin:10px 0 0}
.map-note a{color:var(--board)}
.gps button{border:0;border-radius:10px;background:var(--flag);color:var(--board-deep);font-weight:700;font-size:14px;padding:9px 12px;white-space:nowrap}
.gps button.ghost{background:rgba(255,255,255,.12);color:#fff}
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 14px;padding:2px}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;width:34px;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font:700 16px var(--cond);color:var(--soft);display:grid;place-items:center;position:relative}
.chip.done{background:#dfe8dd;color:var(--board);border-color:#c5d4c3}
.chip.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.skin:after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.player{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--rule)}
.player:first-child{border-top:0;padding-top:2px}
.player:last-child{padding-bottom:2px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--soft)}
.beer-mini{border:0;background:#fdf1c4;color:#6b5300;font:700 12px Barlow;border-radius:999px;padding:3px 9px;margin-left:4px;vertical-align:1px}
.skin-badge{display:inline-block;background:var(--flag);color:var(--board-deep);font:700 12px Barlow;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--rule);background:#fff;font-size:22px;font-weight:600;line-height:1;color:var(--board)}
.mark-score{width:50px;height:50px;display:grid;place-items:center}
.mark-score i{font:800 28px/1 var(--cond);font-style:normal;display:grid;place-items:center;width:42px;height:42px}
.mark-score .none{color:#b9c4b8}
.mark-score .bird{border:2px solid var(--red);border-radius:50%;color:var(--red)}
.mark-score .eagle{border:2px solid var(--red);border-radius:50%;color:var(--red);box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--red)}
.mark-score .bogey{border:2px solid var(--ink);border-radius:4px}
.mark-score .dbl{border:2px solid var(--ink);border-radius:4px;box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--ink)}
.hint{color:var(--soft);font-size:14px;text-align:center;margin:4px 0 0}
.carry-note{margin-top:12px;padding:10px 12px;background:#fdf6d8;border-radius:var(--r-md);font-size:14px;color:#5c4a00}

/* leaderboard */
.board{background:var(--board);border-radius:var(--r-lg);padding:16px 12px 12px;margin-bottom:14px;color:#fff;box-shadow:inset 0 0 0 6px var(--board-deep)}
.board-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 8px 12px}
.board-head b{font:800 26px/1 var(--cond);letter-spacing:.06em}
.board-head span{font-size:13px;color:#9fbfae}
.lb-row{display:grid;grid-template-columns:28px 1fr 44px 58px 76px;gap:5px;align-items:center;margin-bottom:5px}
.lb-row.cols{margin-bottom:6px;font-size:12px;color:#9fbfae;font-weight:600}
.lb-row.cols div{text-align:center}
.lb-row.cols div:nth-child(2){text-align:left;padding-left:10px}
.tile{background:var(--sheet);color:var(--ink);border-radius:3px;height:40px;display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--cond);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.tile.name{justify-content:flex-start;padding:0 10px;font-size:20px;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;white-space:nowrap}
.tile.pos{background:none;color:#fff;box-shadow:none;font-size:20px}
.tile.under{color:var(--red)}
.tile.cash{font-size:19px}
.tile.cash.up{background:var(--flag);color:var(--board-deep)}
.tile.cash.down{color:var(--soft)}
.pay{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.pay:first-of-type{border-top:0;padding-top:2px}
.pay-who{flex:1;min-width:0}
.pay-amt{font:800 28px/1 var(--cond);color:var(--board)}
.venmo{display:inline-flex;align-items:center;gap:6px;background:var(--venmo);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:10px 14px;border-radius:999px;white-space:nowrap;margin-top:6px}
.venmo svg{width:15px;height:15px}
.need-handle{display:flex;gap:6px;margin-top:8px}
.need-handle .input{padding:9px 11px;font-size:15px}
.need-handle button{border:0;border-radius:var(--r-md);background:var(--venmo);color:#fff;font-weight:700;font-size:14px;padding:0 12px}
.fine{font-size:13px;color:var(--soft);margin:12px 0 0;line-height:1.45}
.ledger h4{font:700 17px var(--cond);margin:14px 0 4px;letter-spacing:.02em}
.ledger h4:first-of-type{margin-top:0}
.ledger p{margin:0;padding:5px 0;font-size:14px;color:var(--soft);border-bottom:1px dotted var(--rule)}
.ledger p:last-child{border-bottom:0}
.ledger p b{color:var(--ink);font-weight:600}
.mini{width:100%;border-collapse:collapse;font-size:15px}
.mini td{padding:9px 0;border-top:1px solid var(--rule);vertical-align:middle}
.mini tr:first-child td{border-top:0}
.mini td:last-child{text-align:right;font-weight:700}
.mini .nm{display:flex;align-items:center;gap:10px}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.post{border-radius:10px;overflow:hidden;position:relative;background:var(--sage)}
.post img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.post span{position:absolute;left:6px;bottom:6px;background:rgba(14,26,20,.7);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.post .del{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(14,26,20,.6);color:#fff;font-size:14px;line-height:1}

/* coins & bets */
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe47a,#d9a908);box-shadow:inset 0 0 0 1.5px #b38600;vertical-align:-.12em;margin-right:4px;flex:none}
.wallets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 14px;padding:2px}
.wallets::-webkit-scrollbar{display:none}
.wallet{flex:none;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);padding:10px 14px 10px 10px;display:flex;align-items:center;gap:10px}
.wallet span{display:block;font-size:13px;color:var(--soft);white-space:nowrap}
.wallet b{font:800 22px/1.1 var(--cond)}
.bet{padding:14px 0;border-top:1px solid var(--rule)}
.bet:first-of-type{border-top:0;padding-top:2px}
.bet-q{font-weight:700;font-size:17px;line-height:1.3}
.bet-meta{font-size:13px;color:var(--soft);margin:2px 0 10px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{background:var(--sage);border-radius:var(--r-md);padding:10px 12px;font-size:14px}
.side b{display:block;font:700 15px Barlow;margin-bottom:2px}
.side.win{background:#dff0d3;box-shadow:inset 0 0 0 2px #6aa84f}
.side.lose{opacity:.55}
.settle-row{display:flex;gap:8px;margin-top:10px}
.settle-row button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:var(--r-md);padding:10px;font-weight:700;font-size:14px}
.settle-row button.void{flex:0 0 auto;color:var(--soft)}
.status{display:inline-block;font:700 12px Barlow;padding:2px 8px;border-radius:5px;background:var(--sage);color:var(--soft);margin-left:6px;vertical-align:2px}
.status.open{background:#fdf6d8;color:#5c4a00}
.stake-grid{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;margin-bottom:16px;max-height:40vh;overflow:auto}
.stake-grid .nm{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.pick{display:flex;gap:4px}
.pick button{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:700;color:var(--soft)}
.pick button.on{background:var(--board);border-color:var(--board);color:#fff}
.pick select{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:6px;font:600 13px Barlow}

/* crew & profiles */
.card-list{display:flex;flex-direction:column;gap:10px}
.phero{background:var(--board);color:#fff;border-radius:var(--r-lg);padding:22px 18px 18px;margin-bottom:14px;text-align:center;position:relative}
.phero h2{font:800 34px/1 var(--cond);margin:12px 0 4px;letter-spacing:.01em}
.phero p{margin:0;color:#b9d0c3;font-size:14px}
.photo-btn{position:relative;display:inline-block;border:0;background:none;padding:0;border-radius:50%}
.photo-btn em{position:absolute;right:-2px;bottom:2px;width:28px;height:28px;border-radius:50%;background:var(--flag);display:grid;place-items:center;font-style:normal;border:2px solid var(--board)}
.photo-btn em svg{width:14px;height:14px}
.purse{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.purse div{background:rgba(255,255,255,.08);border-radius:var(--r-md);padding:10px}
.purse b{display:block;font:800 26px/1.1 var(--cond)}
.purse span{font-size:12px;color:#b9d0c3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--rule)}
.stat{background:var(--sheet);padding:12px 10px}
.stat b{display:block;font:800 26px/1.05 var(--cond)}
.stat span{font-size:12px;color:var(--soft)}
.stat b.good{color:var(--win)} .stat b.bad{color:var(--red)}
.spark{width:100%;height:84px;display:block;margin-top:4px}
.rounds .r{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.rounds .r:first-child{border-top:0;padding-top:0}
.rounds .r .d{flex:1;min-width:0}
.rounds .r .d b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rounds .r .d span{font-size:13px;color:var(--soft)}
.rounds .r .sc{font:800 22px var(--cond);min-width:44px;text-align:right}
.rounds .r .sc.under{color:var(--red)}
.trophy{display:inline-block;background:var(--flag);color:var(--board-deep);font:700 11px Barlow;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.trade-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.trade-side{background:var(--sage);border-radius:var(--r-md);padding:12px}
.trade-side select{width:100%;border:1px solid var(--rule);background:#fff;border-radius:10px;padding:10px;font-weight:700;margin-bottom:10px}
.trade-side label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);margin-top:6px}
.trade-side input{width:100%;border:1px solid var(--rule);background:#fff;border-radius:8px;padding:8px;font-weight:700;font-size:16px}
.accept{background:#fdf6d8;border-radius:var(--r-md);padding:14px;margin-bottom:14px;font-size:15px;color:#5c4a00;line-height:1.45}
.accept b{color:var(--ink)}

.pcard{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:8px 12px 8px 8px}
.pc-open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:none;text-align:left;padding:6px;border-radius:14px}
.pc-open .av{width:48px;height:48px;font-size:19px}
.pcard .meta{flex:1;min-width:0}
.pcard .meta b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none}}
</style>

<body>
<header class="top"><div class="top-in" id="topbar"></div></header>
<main id="app"></main>
<div class="dock" id="dock"></div>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab" data-view="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Round</button>
  <button class="tab" data-view="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 21V3.5"/><path d="M7.5 4l10 4-10 4"/><ellipse cx="12" cy="20.5" rx="7" ry="1.5"/></svg>Hole</button>
  <button class="tab" data-view="bets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>Bets</button>
  <button class="tab" data-view="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/></svg>Board</button>
  <button class="tab" data-view="crew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.4.2 4 1.8 4.5 4.3"/></svg>Crew</button>
</div></nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept="image/*" capture="environment" hidden>

<div class="scrim" id="roundScrim"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <h3 id="rTitle">Wrap up this round</h3>
  <p>Saving adds scores, winnings, coins and beer points to everyone’s profile. Your crew and course stay set up for next time.</p>

</div></div>

  <div class="stake-grid" id="stakeGrid"></div>

</div></div>

<div class="scrim" id="tradeScrim"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="tTitle" id="tradeBody"></div></div>

<script>
/* ================= storage ================= */
const ROUND_KEY='side-action-round-v3', STORE_KEY='side-action-store-v1', OLD_KEY='side-action-round-v2';
const START_COINS=1000, BEER_PTS=10;
const COLORS=['#1d4a37','#c4152c','#2f6db5','#b26a00','#6b4fa8','#0f7c7c','#8a3b5c','#4d6b1f','#a14a1c','#3e5170'];
const uid=()=>Math.random().toString(36).slice(2,9);
const freshRound=()=>({view:'setup',hole:0,holes:18,course:{name:'',greens:{}},players:[],
  games:{skins:{on:true,amt:2,carry:true},nassau:{on:true,amt:5},stroke:{on:false,amt:10},birdies:{on:true,amt:1}},
  pars:Array(18).fill(4),scores:[],bets:[],beers:[],pid:null});
const freshStore=()=>({profiles:{},order:[],history:[],trades:[],adult:false,me:null});
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
let S=load(ROUND_KEY), ST=load(STORE_KEY)||freshStore();
if(!S){
  S=freshRound();
  const old=load(OLD_KEY);                 // bring players over from the previous version
  if(old&&old.players){ old.players.forEach(p=>{ if(p.name&&p.name.trim()) S.players.push(newProfile(p.name.trim(),p.handle||'').id); });
    if(old.course) S.course=old.course; if(old.holes) S.holes=old.holes; if(old.games) S.games=old.games; if(old.pars) S.pars=old.pars; ST.adult=!!old.adult; }
}
function newProfile(name,handle=''){
  const id=uid(); ST.profiles[id]={id,name,handle,color:COLORS[ST.order.length%COLORS.length],photo:'',coins:START_COINS,beerPts:0,following:[],created:Date.now()};
  ST.order.push(id); return ST.profiles[id];
}
function save(){
  try{ localStorage.setItem(ROUND_KEY,JSON.stringify(S)); localStorage.setItem(STORE_KEY,JSON.stringify(ST)); return true; }
  catch(e){ toast('Phone storage is full. Remove some beer photos to keep saving.'); return false; }
}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{ const v=Math.abs(n), s=v%1?v.toFixed(2):String(v); return (n<0?'−':'')+'$'+s; };
const signed=n=>(n>0?'+':'')+money(n);
const toPar=n=>n===0?'E':(n>0?'+'+n:String(n));
const num=n=>Math.round(n).toLocaleString();
const prof=id=>ST.profiles[id]||{id,name:'Removed player',handle:'',color:'#9aa59d',photo:'',coins:0,beerPts:0};
const players=()=>S.players.map(id=>prof(id));
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const av=(p,cls='')=>`<span class="av ${cls}" style="background-color:${p.color};${p.photo?`background-image:url(${p.photo})`:''}" aria-hidden="true">${p.photo?'':esc(initials(p.name))}</span>`;
const ready=()=>S.players.length>=2;
const roundStarted=()=>S.scores.some(r=>r&&r.some(v=>v!=null))||S.bets.length||S.beers.length;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }
function ensureScores(){ const n=S.players.length; for(let h=0;h<S.holes;h++){ S.scores[h]=S.scores[h]||[]; S.scores[h].length=n; for(let i=0;i<n;i++) if(S.scores[h][i]===undefined) S.scores[h][i]=null; } }
function closeScrims(){ document.querySelectorAll('.scrim').forEach(s=>s.classList.remove('show')); }

/* ================= money games ================= */
function compute(){
  ensureScores();
  const P=players(), n=P.length, H=S.holes, G=S.games, net=Array(n).fill(0), report=[], skinHoles={}, skinsWon=Array(n).fill(0);
  const done=h=>S.scores[h]&&S.scores[h].every(v=>v!=null);
  if(G.skins.on){
    let carry=0; const lines=[];
    for(let h=0;h<H;h++){
      if(!done(h)) continue;
      const sc=S.scores[h], lo=Math.min(...sc), w=sc.map((v,i)=>v===lo?i:-1).filter(i=>i>=0), pot=1+carry;
      if(w.length===1){ skinsWon[w[0]]+=pot; skinHoles[h]={winner:w[0],skins:pot}; lines.push(`Hole ${h+1}: <b>${esc(P[w[0]].name)}</b> takes ${pot} skin${pot>1?'s':''}`); carry=0; }
      else { skinHoles[h]={tie:true}; carry=G.skins.carry?pot:0; }
    }
    skinsWon.forEach((k,i)=>{ if(!k) return; const v=k*G.skins.amt; net[i]+=v*(n-1); P.forEach((_,j)=>{ if(j!==i) net[j]-=v; }); });
    if(carry) lines.push(`${carry} skin${carry>1?'s':''} still riding on the next outright win`);
    report.push({title:`Skins, ${money(G.skins.amt)} a skin`,lines});
  }
  const seg=(a,b,amt,label)=>{
    for(let h=a;h<b;h++) if(!done(h)) return `${label}: still in play`;
    const tot=P.map((_,i)=>{ let s=0; for(let h=a;h<b;h++) s+=S.scores[h][i]; return s; });
    const lo=Math.min(...tot), W=tot.map((t,i)=>t===lo?i:-1).filter(i=>i>=0);
    if(W.length===n) return `${label}: everyone tied at ${lo}, push`;
    const L=n-W.length; P.forEach((_,i)=>{ net[i]+=W.includes(i)?amt*L/W.length:-amt; });
    return `${label}: <b>${W.map(i=>esc(P[i].name)).join(' and ')}</b> with ${lo}, ${W.length>1?'splitting':'collecting'} ${money(amt*L)}`;
  };
  if(G.nassau.on) report.push({title:H===18?`Nassau, ${money(G.nassau.amt)} a bet`:`9-hole match, ${money(G.nassau.amt)}`,
    lines:H===18?[seg(0,9,G.nassau.amt,'Front 9'),seg(9,18,G.nassau.amt,'Back 9'),seg(0,18,G.nassau.amt,'Overall')]:[seg(0,9,G.nassau.amt,'Match')]});
  if(G.stroke.on) report.push({title:`Low total pot, ${money(G.stroke.amt)} each`,lines:[seg(0,H,G.stroke.amt,'Low total')]});
  if(G.birdies.on){
    const lines=[];
    for(let h=0;h<H;h++) (S.scores[h]||[]).forEach((v,i)=>{ if(v==null) return; const u=S.pars[h]-v; if(u<1) return;
      const val=u*G.birdies.amt; net[i]+=val*(n-1); P.forEach((_,j)=>{ if(j!==i) net[j]-=val; });
      lines.push(`Hole ${h+1}: <b>${esc(P[i].name)}</b> ${u===1?'birdie':u===2?'eagle':'albatross'}, ${money(val)} from each player`); });
    report.push({title:`Birdie bonus, ${money(G.birdies.amt)} a stroke under par`,lines});
  }
  const totals=P.map((_,i)=>{ let s=0,c=0,p=0,b=0,pa=0,bo=0; for(let h=0;h<H;h++){ const v=S.scores[h]?.[i]; if(v!=null){ s+=v;c++;p+=S.pars[h]; const d=v-S.pars[h]; if(d<0)b++; else if(d===0)pa++; else bo++; } } return {strokes:s,thru:c,toPar:s-p,birdies:b,pars:pa,bogeys:bo}; });
  return {P,net:net.map(v=>Math.round(v*100)/100),report,skinHoles,skinsWon,totals};
}
function settle(net){
  const cr=[],db=[]; net.forEach((v,i)=>{ if(v>0.004) cr.push({i,v}); else if(v<-0.004) db.push({i,v:-v}); });
  cr.sort((a,b)=>b.v-a.v); db.sort((a,b)=>b.v-a.v);
  const out=[]; let a=0,b=0;
  while(a<db.length&&b<cr.length){ const x=Math.min(db[a].v,cr[b].v); out.push({from:db[a].i,to:cr[b].i,amt:Math.round(x*100)/100}); db[a].v-=x; cr[b].v-=x; if(db[a].v<.005)a++; if(cr[b].v<.005)b++; }
  return out;
}

/* ================= coins (fake, never money) ================= */
function coinNet(b){
  const n=S.players.length, out=Array(n).fill(0);
  if(b.status!=='yes'&&b.status!=='no') return out;
  const es=Object.entries(b.stakes).map(([i,s])=>({i:+i,...s})).filter(e=>e.i<n&&e.amt>0);
  const pool=es.reduce((a,e)=>a+e.amt,0), wTot=es.filter(e=>e.side===b.status).reduce((a,e)=>a+e.amt,0);
  if(!wTot) return out;
  es.forEach(e=>{ out[e.i]+=e.side===b.status?Math.round(e.amt/wTot*pool)-e.amt:-e.amt; });
  return out;
}
function roundCoinNet(){ const n=S.players.length, t=Array(n).fill(0); S.bets.forEach(b=>coinNet(b).forEach((v,i)=>t[i]+=v)); return t; }
function wallets(){ // spendable coins right now
  const w=players().map(p=>p.coins), rn=roundCoinNet();
  S.bets.forEach(b=>{ if(b.status==='open') Object.entries(b.stakes).forEach(([i,s])=>{ if(+i<w.length) w[+i]-=s.amt; }); });
  return w.map((v,i)=>v+rn[i]);
}
const roundBeers=i=>S.beers.filter(b=>b.p===i).length;
const livePts=i=>players()[i].beerPts+roundBeers(i)*BEER_PTS;

/* ================= profile stats ================= */
function statsFor(id){
  const rows=ST.history.map(r=>({r,me:r.players.find(x=>x.pid===id)})).filter(x=>x.me);
  const full=rows.filter(x=>x.me.thru===x.r.holes);
  const s={rounds:rows.length,wins:rows.filter(x=>x.me.won).length,
    money:rows.reduce((a,x)=>a+x.me.money,0), birdies:rows.reduce((a,x)=>a+x.me.birdies,0), skins:rows.reduce((a,x)=>a+x.me.skins,0),
    beers:rows.reduce((a,x)=>a+x.me.beers,0), coinsWon:rows.reduce((a,x)=>a+x.me.coins,0),
    best:full.length?Math.min(...full.map(x=>x.me.toPar)):null,
    avg18:(()=>{ const f=full.filter(x=>x.r.holes===18); return f.length?Math.round(f.reduce((a,x)=>a+x.me.strokes,0)/f.length*10)/10:null; })(),
    avg9:(()=>{ const f=full.filter(x=>x.r.holes===9); return f.length?Math.round(f.reduce((a,x)=>a+x.me.strokes,0)/f.length*10)/10:null; })(),
    rounds18:full.filter(x=>x.r.holes===18).length, rounds9:full.filter(x=>x.r.holes===9).length,
    avgPar:full.length?Math.round(full.reduce((a,x)=>a+x.me.toPar,0)/full.length*10)/10:null,
    trend:full.slice(-10).map(x=>x.me.toPar), recent:rows.slice(-6).reverse()};
  s.beersPer=s.rounds?Math.round(s.beers/s.rounds*10)/10:null;
  return s;
}
function spark(vals){
  if(vals.length<2) return `<p class="fine" style="margin:4px 0 0">Play two full rounds to see your trend.</p>`;
  const W=320,H=84,pad=12, lo=Math.min(...vals), hi=Math.max(...vals), span=Math.max(1,hi-lo);
  const pts=vals.map((v,i)=>[pad+i*(W-2*pad)/(vals.length-1), pad+(v-lo)/span*(H-2*pad)]); // lower score = higher on chart
  const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Last ${vals.length} rounds to par: ${vals.map(toPar).join(', ')}">
    <polyline points="${line}" fill="none" stroke="#1d4a37" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?'#c4152c':'#1d4a37'}"/>`).join('')}</svg>`;
}

/* ================= venmo ================= */
const cleanHandle=h=>(h||'').trim().replace(/^@/,'').replace(/\s+/g,'');
const venmoLink=(h,amt)=>`https://venmo.com/${encodeURIComponent(h)}?txn=pay&amount=${amt.toFixed(2)}&note=${encodeURIComponent(`Golf side games${S.course.name?' at '+S.course.name:''}`)}`;

/* ================= GPS ================= */
const GPS={state:'idle',pos:null,acc:null,watch:null,msg:''};
const BLOCKED='Location is blocked in this preview. GPS works once the app runs on its own web address.';
function startGPS(){
  if(GPS.watch!=null) return;
  if(!('geolocation' in navigator)){ GPS.state='blocked'; GPS.msg='This browser has no location support.'; return; }
  GPS.state='finding';
  try{ GPS.watch=navigator.geolocation.watchPosition(p=>{ GPS.pos=[p.coords.latitude,p.coords.longitude]; GPS.acc=p.coords.accuracy; GPS.state='live'; paintGPS(); },
    err=>{ GPS.state='blocked'; GPS.watch=null; GPS.msg=err.code===1?BLOCKED:'Couldn’t get a GPS fix. Try again in the open.'; paintGPS(); },{enableHighAccuracy:true,maximumAge:3000,timeout:15000}); }
  catch(e){ GPS.state='blocked'; GPS.msg=BLOCKED; }
}
function meters([la1,lo1],[la2,lo2]){ const R=6371e3,r=d=>d*Math.PI/180; const a=Math.sin(r(la2-la1)/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(r(lo2-lo1)/2)**2; return 2*R*Math.asin(Math.sqrt(a)); }
const yardsTo=p=>Math.round(meters(GPS.pos,p)*1.09361);
/* the green for this hole: a pin you saved beats the map */
function greenFor(h){
  const pin=S.course.greens?.[h], m=S.course.map?.[h];
  if(pin) return {c:pin,poly:null,src:'pin'};
  if(m) return {c:m.c,poly:m.poly,src:'map'};
  return null;
}
function paintGPS(){
  const el=$('#gps'); if(!el) return; const g=greenFor(S.hole);
  if(GPS.state==='live'&&g){
    let fb='';
    if(g.poly&&g.poly.length>2){ const ds=g.poly.map(yardsTo); fb=`Front ${Math.min(...ds)} · Back ${Math.max(...ds)}<br>`; }
    el.innerHTML=`<div class="gps-yds">${yardsTo(g.c)}<small>yds</small></div><div class="gps-msg">${fb||'to the middle of the green<br>'}±${Math.round(GPS.acc*1.09)} yds · ${g.src==='map'?'course map':'your pin'}</div><button class="ghost" data-pin>${g.src==='map'?'Fix':'Re-pin'}</button>`;
  }
  else if(GPS.state==='live') el.innerHTML=`<div class="gps-msg">${S.course.map?`Hole ${S.hole+1} isn’t on the course map.`:'No green saved for this hole yet.'} Stand in the middle of the green and pin it.</div><button data-pin>Pin green</button>`;
  else if(GPS.state==='finding') el.innerHTML=`<div class="gps-msg">Finding your location…</div>`;
  else if(GPS.state==='blocked') el.innerHTML=`<div class="gps-msg">${esc(GPS.msg)}</div><button class="ghost" data-retry>Retry</button>`;
  else el.innerHTML=`<div class="gps-msg">Turn on GPS for live yardage to the green.</div><button data-gps>Turn on GPS</button>`;
}

/* ================= course maps (OpenStreetMap) =================
   Courses come from OpenStreetMap: golf=hole lines run tee → green (ref = hole number),
   golf=green areas outline each green. Coverage varies course to course. */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const FIND={state:'idle',results:[],msg:'',q:''};
async function overpass(q){
  let err;
  for(const u of OVERPASS){
    try{ const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
      if(r.ok) return await r.json(); err=new Error('HTTP '+r.status); }catch(e){ err=e; }
  }
  throw err;
}
function getPosition(){
  return new Promise((res,rej)=>{
    if(GPS.pos) return res(GPS.pos);
    if(!('geolocation' in navigator)) return rej(new Error('nogeo'));
    try{ navigator.geolocation.getCurrentPosition(p=>res([p.coords.latitude,p.coords.longitude]),rej,{enableHighAccuracy:true,timeout:15000,maximumAge:60000}); }catch(e){ rej(e); }
  });
}
const netMsg=e=>e&&e.code===1?BLOCKED:(location.protocol==='file:'||/claude/.test(location.hostname)?'Course lookup needs the app on its own web address.':'Couldn’t reach the course map. Check your signal and try again.');
async function findNear(){
  FIND.state='loading'; FIND.msg='Finding courses near you…'; render();
  try{
    const here=await getPosition();
    const d=await overpass(`[out:json][timeout:25];(way[leisure=golf_course](around:10000,${here[0]},${here[1]});relation[leisure=golf_course](around:10000,${here[0]},${here[1]}););out tags center;`);
    FIND.results=d.elements.filter(e=>e.center).map(e=>({type:e.type,id:e.id,name:e.tags?.name||'Unnamed golf course',lat:e.center.lat,lon:e.center.lon,
      sub:`${(meters(here,[e.center.lat,e.center.lon])/1609.34).toFixed(1)} mi away`,dist:meters(here,[e.center.lat,e.center.lon])})).sort((a,b)=>a.dist-b.dist).slice(0,8);
    FIND.state='results'; FIND.msg=FIND.results.length?'':'No mapped golf courses within 6 miles.';
  }catch(e){ FIND.state='error'; FIND.msg=netMsg(e); }
  render();
}
async function searchCourses(q){
  if(!q) return; FIND.q=q;
  FIND.state='loading'; FIND.msg=`Searching for “${q}”…`; render();
  try{
    const go=async s=>{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&q=${encodeURIComponent(s)}`); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); };
    let rows=(await go(q)).filter(r=>r.type==='golf_course');
    if(!rows.length&&!/golf/i.test(q)) rows=(await go(q+' golf course')).filter(r=>r.type==='golf_course');
    FIND.results=rows.slice(0,8).map(r=>{ const parts=r.display_name.split(', ');
      return {type:r.osm_type,id:+r.osm_id,name:r.name||parts[0],lat:+r.lat,lon:+r.lon,sub:parts.slice(1,4).join(', ')}; });
    FIND.state='results'; FIND.msg=FIND.results.length?'':'No golf courses matched. Try the course’s full name or add the town.';
  }catch(e){ FIND.state='error'; FIND.msg=netMsg(e); }
  render();
}
async function loadCourse(r){
  FIND.state='loading'; FIND.msg=`Loading ${r.name}…`; render();
  try{
    const area = r.type==='node'
      ? `(way[golf~"^(hole|green)$"](around:1500,${r.lat},${r.lon}););`
      : `${r.type}(${r.id})->.c;.c out tags;.c map_to_area->.a;(way(area.a)[golf~"^(hole|green)$"];);`;
    const d=await overpass(`[out:json][timeout:30];${area}out tags geom;`);
    const tags=(d.elements.find(e=>e.type===r.type&&e.id===r.id)||{}).tags||{};
    const greens=d.elements.filter(e=>e.tags?.golf==='green'&&e.geometry).map(e=>{ const poly=e.geometry.map(g=>[g.lat,g.lon]);
      const ring=poly.length>3&&poly[0][0]===poly.at(-1)[0]&&poly[0][1]===poly.at(-1)[1]?poly.slice(0,-1):poly; // outlines repeat their first point
      return {poly:ring,c:[ring.reduce((a,p)=>a+p[0],0)/ring.length,ring.reduce((a,p)=>a+p[1],0)/ring.length]}; });
    const map={}, pars={};
    d.elements.filter(e=>e.tags?.golf==='hole'&&e.geometry).forEach(e=>{
      const n=parseInt(e.tags.ref,10); if(!(n>=1&&n<=18)||map[n-1]) return;   // first hole with each number wins
      const end=[e.geometry.at(-1).lat,e.geometry.at(-1).lon];
      let best=null,bd=90; greens.forEach(g=>{ const m=meters(end,g.c); if(m<bd){ bd=m; best=g; } });
      map[n-1]={c:best?best.c:end,poly:best?best.poly:null};
      const p=parseInt(e.tags.par,10); if(p>=3&&p<=6) pars[n-1]=p;
    });
    for(let h=0;h<18;h++){ const p=parseInt(tags[`golf:hole:${h+1}:par`],10); if(!pars[h]&&p>=3&&p<=6) pars[h]=p; }
    const mapped=Object.keys(map).length, maxRef=Math.max(0,...Object.keys(map).map(k=>+k+1)), declared=parseInt(tags['golf:holes'],10);
    const holes=declared===9||declared===18?declared:(maxRef>9?18:maxRef>0?9:S.holes);
    S.course={name:tags.name||r.name,greens:{},map:mapped?map:null,osm:{type:r.type,id:r.id},mapped};
    S.holes=holes; Object.entries(pars).forEach(([h,p])=>S.pars[+h]=p);
    if(S.hole>=S.holes) S.hole=S.holes-1;
    FIND.state='idle'; FIND.results=[]; FIND.msg='';
    render();
    toast(mapped?`Loaded ${mapped} hole${mapped>1?'s':''}${Object.keys(pars).length?' with pars':''}`:'This course isn’t mapped hole by hole yet. Pin greens as you play.');
  }catch(e){ FIND.state='error'; FIND.msg=netMsg(e); render(); }
}
function courseFinder(){
  if(roundStarted()) return S.course.map?`<p class="map-note">Course map: ${S.course.mapped} of ${S.holes} holes · <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></p>`:'';
  const res=FIND.state==='results'&&FIND.results.length?`<div class="finds">${FIND.results.map((r,k)=>`<button class="find" data-loadcourse="${k}"><b>${esc(r.name)}</b><span>${esc(r.sub)}</span></button>`).join('')}</div>`:'';
  return `<div class="finder">
      <button class="btn btn-quiet near" id="findNear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>Courses near me</button>
      <div class="newp"><input class="input" id="courseQ" value="${esc(FIND.q)}" placeholder="Search by course name" autocomplete="off" aria-label="Search courses by name"><button class="btn btn-main" id="searchCourse">Search</button></div>
    </div>
    ${FIND.msg?`<p class="find-msg ${FIND.state==='error'?'err':''}">${esc(FIND.msg)}</p>`:''}${res}
    ${S.course.map?`<p class="map-note">Course map loaded: ${S.course.mapped} of ${S.holes} holes · <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></p>`:S.course.osm?`<p class="map-note">This course has no hole-by-hole map yet. Pin greens as you play.</p>`:''}

/* ---- following ---- */
const meP=()=>ST.me&&ST.profiles[ST.me]?ST.profiles[ST.me]:null;
const followingOf=id=>(ST.profiles[id]?.following||[]).filter(f=>ST.profiles[f]);
const followersOf=id=>ST.order.filter(o=>o!==id&&followingOf(o).includes(id));
const isFollowing=id=>!!meP()&&followingOf(ST.me).includes(id);
function toggleFollow(id){
  const me=meP(); if(!me||id===me.id) return;
  me.following=me.following||[];
  if(me.following.includes(id)){ me.following=me.following.filter(f=>f!==id); toast(`Unfollowed ${prof(id).name}`); }
  else { me.following.push(id); toast(`Following ${prof(id).name}`); }
  render();
}
function feedFor(ids){
  const items=[];
  ST.history.forEach(r=>r.players.forEach(x=>{ if(ids.includes(x.pid)) items.push({t:r.date,pid:x.pid,kind:'round',r,me:x}); }));
  ST.trades.forEach(t=>{ if(ids.includes(t.a)||ids.includes(t.b)) items.push({t:t.t,kind:'trade',tr:t}); });

const T={a:null,b:null,give:{coins:0,beer:0},get:{coins:0,beer:0},stage:'build'};
function openTrade(from){
  const ids=ST.order; T.a=from||ids[0]; T.b=ids.find(i=>i!==T.a); T.give={coins:0,beer:0}; T.get={coins:0,beer:0}; T.stage='build';
  paintTrade(); $('#tradeScrim').classList.add('show');
}
function paintTrade(){
  const A=prof(T.a), B=prof(T.b), opts=sel=>ST.order.map(id=>`<option value="${id}" ${id===sel?'selected':''}>${esc(prof(id).name)}</option>`).join('');
  const sideHtml=(who,key,pp)=>`<div class="trade-side"><select data-tparty="${who}" aria-label="Trader">${opts(pp.id)}</select>
    <div style="font-size:13px;color:var(--soft)">Has <span class="coin"></span>${num(pp.coins)}${ST.adult?` · ${num(pp.beerPts)} beer pts`:''}</div>

    ${ST.adult?`<label>Gives beer pts</label><input type="number" inputmode="numeric" min="0" step="10" value="${T[key].beer||''}" placeholder="0" data-tval="${key}.beer">`:''}</div>`;

    <div class="trade-row">${sideHtml('a','give',A)}${sideHtml('b','get',B)}</div>
    <div class="row"><button class="btn btn-quiet" data-close>Cancel</button><button class="btn btn-main" id="tPropose">Send offer</button></div>`
  : `<h3 id="tTitle">${esc(B.name)}, do you accept?</h3><p>Hand the phone to ${esc(B.name)}.</p>
    <div class="accept"><b>${esc(A.name)}</b> gives ${fmtGoods(T.give)}.<br><b>${esc(B.name)}</b> gives ${fmtGoods(T.get)}.</div>
    <div class="row"><button class="btn btn-quiet" id="tDecline">Decline</button><button class="btn btn-main" id="tAccept">Accept trade</button></div>`;
}
function tradeError(){
  const A=prof(T.a), B=prof(T.b), g=T.give, r=T.get;
  if(T.a===T.b) return 'Pick two different players';
  if(!(g.coins||g.beer||r.coins||r.beer)) return 'Add something to the trade';
  if([g.coins,g.beer,r.coins,r.beer].some(v=>v<0||!Number.isInteger(v))) return 'Use whole numbers';
  const locked=id=>{ const i=S.players.indexOf(id); if(i<0) return 0; let l=0; S.bets.forEach(b=>{ if(b.status==='open'&&b.stakes[i]) l+=b.stakes[i].amt; }); return l; };
  if(g.coins>A.coins-locked(A.id)) return `${A.name} doesn’t have ${num(g.coins)} free coins`;
  if(r.coins>B.coins-locked(B.id)) return `${B.name} doesn’t have ${num(r.coins)} free coins`;
  if(g.beer>A.beerPts) return `${A.name} doesn’t have ${num(g.beer)} beer points`;
  if(r.beer>B.beerPts) return `${B.name} doesn’t have ${num(r.beer)} beer points`;
  return '';
}

/* ================= saving a round ================= */
function saveRound(){
  const {P,net,skinsWon,totals}=compute(), rcn=roundCoinNet();
  const full=totals.filter(t=>t.thru===S.holes), lo=full.length?Math.min(...full.map(t=>t.strokes)):null;
  const rec={id:uid(),date:Date.now(),course:S.course.name,holes:S.holes,players:P.map((p,i)=>({pid:p.id,strokes:totals[i].strokes,toPar:totals[i].toPar,thru:totals[i].thru,
    birdies:totals[i].birdies,skins:skinsWon[i],money:net[i],coins:rcn[i],beers:roundBeers(i),won:lo!=null&&totals[i].thru===S.holes&&totals[i].strokes===lo}))};
  if(rec.players.some(x=>x.thru>0)) ST.history.push(rec);
  P.forEach((p,i)=>{ const q=ST.profiles[p.id]; if(!q) return; q.coins+=rcn[i]; q.beerPts+=roundBeers(i)*BEER_PTS; });
  resetRound();
}
function resetRound(){ const keep={players:S.players,course:S.course,holes:S.holes,games:S.games,pars:S.pars}; S={...freshRound(),...keep,view:'setup'}; }

function shrinkPhoto(file,max){ return new Promise((res,rej)=>{ const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{ let w=img.width,h=img.height,sq=photoFor?.type==='avatar'; const c=document.createElement('canvas'), x=c.getContext('2d');
    if(sq){ const m=Math.min(w,h); c.width=c.height=max; x.drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,max,max); }
    else { const s=Math.min(1,max/Math.max(w,h)); c.width=Math.round(w*s); c.height=Math.round(h*s); x.drawImage(img,0,0,c.width,c.height); }
    URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.62)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; img.src=url; }); }
$('#picker').addEventListener('change',async e=>{

    else { const photo=await shrinkPhoto(f,160); ST.profiles[photoFor.id].photo=photo; render(); toast('Photo updated'); }
  }catch(err){ toast('Couldn’t read that photo. Try another.'); }
  photoFor=null;
});

  }
  else if(d.settle){ const b=S.bets.find(x=>x.id===d.settle); if(b){ b.status=d.r; render(); toast(d.r==='void'?'Bet called off, coins returned':'Bet settled'); } }
  /* board */
  else if(d.savehandle){ const inp=$(`[data-quick="${d.savehandle}"]`), h=cleanHandle(inp.value); if(!h){ inp.focus(); return; } ST.profiles[d.savehandle].handle=h; render(); toast('Venmo added'); }
  else if(t.id==='copy'){ const {P,net,totals}=compute(), pays=settle(net), order=P.map((_,i)=>i).sort((a,b)=>totals[a].toPar-totals[b].toPar);
    const txt=[`⛳ ${S.course.name||'Golf'} results`,...order.map(i=>`${P[i].name}: ${totals[i].strokes} (${toPar(totals[i].toPar)})  ${signed(net[i]).replace('−','-')}`),'','Settle up:',...(pays.length?pays.map(p=>`${P[p.from].name} → ${P[p.to].name} ${money(p.amt)}`):['All square'])].join('\n');
    try{ await navigator.clipboard.writeText(txt); toast('Results copied'); }catch(err){ toast('Copying is blocked here'); } }
  else if(t.id==='wrap'||t.id==='wrap2'){ const open=S.bets.filter(b=>b.status==='open').length;
    $('#rSave').textContent=open?`Save round (${open} open bet${open>1?'s':''} will be called off)`:'Save round to profiles'; $('#roundScrim').classList.add('show'); }
  else if(t.id==='rSave'){ S.bets.forEach(b=>{ if(b.status==='open') b.status='void'; }); saveRound(); closeScrims(); render(); toast('Round saved to profiles'); }
  else if(t.id==='rDiscard'){ resetRound(); closeScrims(); render(); toast('Round discarded'); }
  /* crew */
  else if(d.open){ S.pid=d.open; go('profile'); }
  else if(d.follow){ toggleFollow(d.follow); }
  else if(d.setme){ ST.me=d.setme; const p=ST.profiles[d.setme]; p.following=p.following||[]; render(); toast(`Signed in as ${p.name} on this phone`); }
  else if(t.id==='notMe'){ ST.me=null; render(); }
  else if(d.showlist){ showFollowList(d.showlist); }
  else if(t.id==='setPhoto2'){ photoFor={type:'avatar',id:S.pid}; $('#picker').click(); }
  else if(t.id==='rmPhoto'){ ST.profiles[S.pid].photo=''; render(); toast('Photo removed'); }
  else if(t.id==='setPhoto'){ photoFor={type:'avatar',id:S.pid}; $('#picker').click(); }
  else if(t.id==='delProfile'){ const id=S.pid; if(t.dataset.armed!=='1'){ t.dataset.armed='1'; t.textContent='Tap again to delete for good'; return; }
    delete ST.profiles[id]; ST.order=ST.order.filter(x=>x!==id); if(ST.me===id) ST.me=null; Object.values(ST.profiles).forEach(q=>{ if(q.following) q.following=q.following.filter(f=>f!==id); }); const i=S.players.indexOf(id); if(i>=0){ S.players.splice(i,1); S.scores.forEach(r=>r&&r.splice(i,1)); }
    go('crew'); toast('Profile deleted'); }
  else if(t.id==='openTrade') openTrade();
  else if(t.id==='tradeFrom') openTrade(S.pid);
  else if(t.id==='tPropose'){ const err=tradeError(); if(err){ toast(err); return; } T.stage='confirm'; paintTrade(); }
  else if(t.id==='tDecline'){ closeScrims(); toast('Trade declined'); }
  else if(t.id==='tAccept'){ const err=tradeError(); if(err){ toast(err); T.stage='build'; paintTrade(); return; }
    const A=ST.profiles[T.a], B=ST.profiles[T.b];
    A.coins+=T.get.coins-T.give.coins; B.coins+=T.give.coins-T.get.coins; A.beerPts+=T.get.beer-T.give.beer; B.beerPts+=T.give.beer-T.get.beer;
    ST.trades.push({id:uid(),t:Date.now(),a:T.a,b:T.b,give:{...T.give},get:{...T.get}}); closeScrims(); render(); toast('Trade done'); }
});

render();
</script>
</body>
</html>
